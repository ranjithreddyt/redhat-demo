# Trigger this pipeline manually (`oc create -f pipeline/pipelinerun.yaml`)
# or via the OpenShift Pipelines console ("Start"). Every run rebuilds,
# pushes, and redeploys - no separate promotion step.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: nginx-deploy-
  namespace: app-dev
spec:
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/ranjithreddyt/redhat-demo.git
      - name: revision
        value: main
      - name: pathInRepo
        value: pipeline/pipeline.yaml
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
    - name: git-url
      value: https://github.com/ranjithreddyt/redhat-demo.git
    - name: git-revision
      value: main
    - name: image-repo
      value: quay-8rnsl.apps.cluster-8rnsl.8rnsl.sandbox2169.opentlc.com/nginx-demo/nginx-app-dev
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    - name: dockerconfig
      secret:
        secretName: quay-dev-pusher
    - name: git-credentials
      secret:
        secretName: git-credentials
