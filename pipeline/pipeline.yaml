# Single pipeline, single environment: on every push to main, clone,
# build, push the image to Quay, then bump chart/values.yaml and push
# back to Git. ArgoCD watches chart/ and syncs automatically - no
# manual promotion step, no second pipeline.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: nginx-deploy
  namespace: app-dev
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: image-repo
      type: string
      description: "Quay repo to push to, e.g. quay-host/nginx-demo/nginx-app-dev"
  workspaces:
    - name: shared-workspace
    - name: dockerconfig
    - name: git-credentials
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    - name: build-and-push
      runAfter: [fetch-source]
      taskRef:
        name: buildah
        kind: ClusterTask
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: IMAGE
          value: "$(params.image-repo):$(tasks.fetch-source.results.commit)"

    - name: scan-image
      runAfter: [build-and-push]
      taskRef:
        name: rhacs-scan
      params:
        - name: image
          value: "$(params.image-repo):$(tasks.fetch-source.results.commit)"

    - name: update-gitops
      runAfter: [scan-image]
      taskRef:
        name: git-cli
        kind: ClusterTask
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: basic-auth
          workspace: git-credentials
      params:
        - name: GIT_USER_NAME
          value: "tekton-ci-bot"
        - name: GIT_USER_EMAIL
          value: "ci-bot@users.noreply.github.com"
        - name: GIT_SCRIPT
          value: |
            git config --global --add safe.directory "$(workspaces.source.path)"
            cd "$(workspaces.source.path)"
            sed -i "s#tag: .*#tag: \"$(tasks.fetch-source.results.commit)\"#" chart/values.yaml
            git add chart/values.yaml
            git commit -m "deploy: nginx-app-dev@$(tasks.fetch-source.results.commit)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
