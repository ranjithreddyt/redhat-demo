# Pipelines-as-Code definition: this file is what the PAC controller reads
# on every GitHub webhook event for this repo. A push to main creates a
# PipelineRun automatically - no manual `oc create`.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: nginx-deploy-
  namespace: app-dev
  annotations:
    # CEL expression replaces on-event/on-target-branch when present, so it
    # must encode both the event/branch match AND the loop-prevention check:
    # skip any push whose commit message was written by this pipeline's own
    # write-back step (prefixed "deploy:") - otherwise every automated
    # commit re-triggers itself indefinitely.
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "push" && target_branch == "refs/heads/main" &&
      !body.head_commit.message.startsWith("deploy:")
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: "{{ repo_url }}"
      - name: revision
        value: "{{ revision }}"
      - name: pathInRepo
        value: pipeline/pipeline.yaml
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ revision }}"
    - name: image-repo
      value: quay-8rnsl.apps.cluster-8rnsl.8rnsl.sandbox2169.opentlc.com/nginx-demo/nginx-app-dev
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    - name: dockerconfig
      secret:
        secretName: quay-dev-pusher
    - name: git-credentials
      secret:
        secretName: git-credentials
