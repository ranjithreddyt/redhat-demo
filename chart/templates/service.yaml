apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-app.fullname" . }}
  labels:
    {{- include "nginx-app.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "nginx-app.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
