# Registers the private redhat-demo GitHub repo with ArgoCD so it can read
# the per-environment values files (the second source in each Application's
# multi-source spec). Template only - the real `password` is applied
# directly to the cluster, never committed here.
apiVersion: v1
kind: Secret
metadata:
  name: redhat-demo-git-repo
  namespace: janus-argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  url: https://github.com/ranjithreddyt/redhat-demo.git
  type: git
  username: ranjithreddyt
  password: "<set via oc, not stored here - see cluster-setup/rbac-and-secrets.md>"
