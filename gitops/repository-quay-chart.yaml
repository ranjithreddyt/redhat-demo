# Registers the Quay OCI Helm repo with ArgoCD so it can pull nginx-app
# chart versions directly. One chart, one repo - every environment's
# Application below references the exact same targetRevision (0.1.0).
#
# Template only - the `password` field is intentionally left blank here.
# The real credential is applied directly to the cluster (see
# cluster-setup/rbac-and-secrets.md) and is never committed to this repo.
apiVersion: v1
kind: Secret
metadata:
  name: quay-nginx-chart-repo
  namespace: janus-argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  url: quay-8rnsl.apps.cluster-8rnsl.8rnsl.sandbox2169.opentlc.com/nginx-demo
  name: nginx-app-chart
  type: helm
  enableOCI: "true"
  username: nginx-demo+chart_publisher
  password: "<set via oc, not stored here - see cluster-setup/rbac-and-secrets.md>"
