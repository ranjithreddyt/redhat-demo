apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app-stage
  namespace: janus-argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ranjithreddyt/redhat-demo.git
    targetRevision: main
    path: chart
    helm:
      valueFiles: [values.yaml, values-stage.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: app-stage
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
