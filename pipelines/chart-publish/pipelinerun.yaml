# Manual trigger - run this whenever chart/ changes. Production hardening
# note: wire as a Pipelines-as-Code run filtered to `chart/**` path changes,
# separate from the .tekton/push.yaml build trigger (which fires on every
# commit regardless of path).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: nginx-chart-publish-
  namespace: app-dev
spec:
  pipelineRef:
    name: nginx-chart-publish
  serviceAccountName: pipeline
  params:
    - name: git-url
      value: https://github.com/ranjithreddyt/redhat-demo.git
    - name: git-revision
      value: main
    - name: quay-host
      value: quay-8rnsl.apps.cluster-8rnsl.8rnsl.sandbox2169.opentlc.com
    - name: quay-org
      value: nginx-demo
    - name: chart-version
      value: "0.1.0"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    - name: registry-auth
      secret:
        secretName: quay-chart-publisher
