# Promotion pipeline: copies an already-built, already-signed image by digest
# from one Quay repo to the next (dev -> stage -> prod) via skopeo - no rebuild,
# ever. Then bumps the target environment's values file so ArgoCD picks it up.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: nginx-promote
  namespace: app-dev
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: source-image-repo
      type: string
      description: "Quay repo to promote FROM, e.g. .../nginx-demo/nginx-app-dev"
    - name: dest-image-repo
      type: string
      description: "Quay repo to promote TO, e.g. .../nginx-demo/nginx-app-stage"
    - name: image-tag
      type: string
      description: "Commit-SHA tag being promoted - must already exist in source-image-repo"
    - name: values-file
      type: string
      description: "Path (relative to repo root) of the values file to bump, e.g. chart/values-stage.yaml"
    - name: target-env
      type: string
      description: "Environment label used in the commit message, e.g. stage"
  workspaces:
    - name: shared-workspace
    - name: images-url   # required by skopeo-copy's workspace contract; unused in single-image mode
    - name: git-credentials
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    - name: promote-image
      taskRef:
        name: skopeo-copy
        kind: ClusterTask
      workspaces:
        - name: images-url
          workspace: images-url
      params:
        - name: srcImageURL
          value: "docker://$(params.source-image-repo):$(params.image-tag)"
        - name: destImageURL
          value: "docker://$(params.dest-image-repo):$(params.image-tag)"

    - name: update-gitops-target
      runAfter: [fetch-source, promote-image]
      taskRef:
        name: git-cli
        kind: ClusterTask
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: basic-auth
          workspace: git-credentials
      params:
        - name: GIT_USER_NAME
          value: "tekton-ci-bot"
        - name: GIT_USER_EMAIL
          value: "ci-bot@users.noreply.github.com"
        - name: GIT_SCRIPT
          value: |
            cd "$(workspaces.source.path)"
            sed -i "s#tag: .*#tag: \"$(params.image-tag)\"#" $(params.values-file)
            git add $(params.values-file)
            git commit -m "promote: $(params.image-tag) -> $(params.target-env)"
            git push origin HEAD:$(params.git-revision)
